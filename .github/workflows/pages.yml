# Publishes the GDML viewer in gdml-viewer/ to GitHub Pages:
# https://grzanka.github.io/mlinpl2026-half-life-skills/
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy GDML viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["gdml-viewer/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gdml-viewer
      - id: deployment
        uses: actions/deploy-pages@v4
